<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeLevel</title>

    <link rel="stylesheet" href="site1.css">
</head>

<body>
    <!-- EN-TÊTE -->
    <header class="header">

        <h1>CodeLevel</h1>

        <p>
            Évalue ton niveau en programmation
        </p>

    </header>


    <!-- CONTENU PRINCIPAL -->

    <main>

        <!-- INFORMATIONS DE L'UTILISATEUR -->
        <section class="user-section">

            <h2>Informations du programmeur</h2>

            <form>

                <label for="name">Nom</label>
                <input type="text" id="name" placeholder="Votre nom">


                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Votre adresse email">


                <label for="language">Langage de programmation</label>

                <select id="language">

                    <option value="">Choisir un langage</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="php">PHP</option>

                </select>


                <label for="experience">Années d'expérience</label>

                <input
                    type="number"
                    id="experience"
                    placeholder="Ex : 2"
                    min="0"
                >

            </form>

        </section>


        <!-- ESPACE CODE -->
        <section class="code-section">

            <h2>Votre code</h2>

            <textarea
                class="code-editor"
                placeholder="Écrivez ou collez votre code ici..."
            ></textarea>

            <button class="evaluate-button">
                Évaluer mon code
            </button>

        </section>


        <!-- RÉSULTAT -->
        <section class="result-section">

            <h2>Résultat</h2>

            <div class="result-box">

                <p class="result-title">
                    Votre niveau
                </p>

                <p class="level">
                    En attente...
                </p>

                <p class="score">
                    Score : -- / 100
                </p>

                <p class="message">
                    Votre résultat apparaîtra ici après l'évaluation.
                </p>

            </div>

        </section>

    </main>


    <!-- PIED DE PAGE -->
    <footer>

        <p><marquee>
            © NovaTech - des idées neuves, un engagement concret
        </marquee></p>

    </footer>
<script src="script.js"></script>
</body>

</html>
