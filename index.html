<!DOCTYPE html><html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLevel | NovaTech</title>
    <link rel="stylesheet" href="site1.css">
</head>
<body><header class="header">
    <h1>CodeLevel</h1>
    <p>Découvre ton niveau en programmation !</p>
</header>

<main>
    <section class="code-editor">
        <h2>Évalue ton code</h2>

        <form id="evaluation-form">
            <label for="name">Ton nom :</label>
            <input type="text" id="name" required>

            <label for="email">Ton adresse e-mail :</label>
            <input type="email" id="email" required>

            <label for="language">Langage de programmation :</label>
            <select id="language" required>
                <option value="">Choisir un langage</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="php">PHP</option>
            </select>

            <label for="experience">Ton expérience :</label>
            <select id="experience" required>
                <option value="">Choisir ton expérience</option>
                <option value="debutant">Débutant</option>
                <option value="intermediaire">Intermédiaire</option>
                <option value="avance">Avancé</option>
            </select>

            <label for="code">Colle ton code ici :</label>
            <textarea id="code" class="code-editor" rows="10" required></textarea>

            <button type="submit" class="evaluate-button">
                Évaluer mon code
            </button>
        </form>
    </section>

    <section class="result-box">
        <h2>Résultat</h2>
        <p>Niveau : <span class="level">En attente</span></p>
        <p>Score : <span class="score">--/100</span></p>
        <p class="message">Ton résultat apparaîtra ici.</p>
    </section>
</main>

<footer>
    <p>&copy; 2026 NovaTech — CodeLevel</p>
</footer>

<script src="script.js"></script>

</body>
  </html>
